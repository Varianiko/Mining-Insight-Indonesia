
<script>
document.getElementById("setupForm")
.addEventListener("submit", async function(e) {
  e.preventDefault();

  const form = this;
  const result = document.getElementById("result");
  const button = form.querySelector("button");

  result.textContent = "Sedang memproses...";
  button.disabled = true;
  button.textContent = "MEMPROSES...";

  try {
    const response = await fetch("/api/setup-admin", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Setup-Secret": document.getElementById("secret").value
      },
      body: JSON.stringify({
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value
      })
    });

    const data = await response.json();

    if (data.success) {
      result.textContent = "BERHASIL: " + data.message;
      form.reset();
    } else {
      result.textContent =
        "GAGAL: " + (data.message || "Terjadi kesalahan.") +
        (data.detail ? " | DETAIL: " + data.detail : "") +
        " | KODE: " + response.status;
    }

  } catch (error) {
    result.textContent = "KONEKSI GAGAL: " + error.message;
  } finally {
    button.disabled = false;
    button.textContent = "BUAT AKUN ADMIN";
  }
});
</script>
